<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>房型｜海岸小旅（網站提案示範）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chiron+Sung+HK:wght@400;700&family=Cormorant+Garamond:ital,wght@0,500;1,500&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body data-page="rooms.html">
<header id="site-head"></header>
<main>
  <div class="page-head">
    <div class="wrap">
      <p class="latin">rooms</p>
      <h1>房型</h1>
      <p>每間房都有陽台、冷氣、獨立衛浴、平面電視、冰箱和電熱水壺。</p>
    </div>
  </div>
  <section class="sec">
    <div class="wrap"><div class="room-rows" id="rooms" style="margin-top:0"></div></div>
  </section>
</main>
<footer id="site-foot"></footer>
<script src="assets/data.js"></script>
<script src="assets/site.js"></script>
<script src="assets/guard.js"></script>
<script>
(function () {
  var data = HA.Store.load();
  document.getElementById("rooms").innerHTML = data.rooms.map(function (r) {
    return '<a class="room-row" href="room.html?id=' + encodeURIComponent(r.id) + '">' +
      '<div class="photo">' + roomPhoto(r) + '</div>' +
      '<div><p class="meta">' + r.guests + ' 人　' + HA.esc(r.bed) + '</p><h3>' + HA.esc(r.name) + '</h3><p>' + HA.esc(r.desc) + '</p>' +
      '<p class="price-line"><span>平日<b>' + HA.money(r.weekday) + '</b></span><span>假日<b>' + HA.money(r.weekend) + '</b></span></p><span class="more">看房間</span></div></a>';
  }).join("") || '<p class="muted">目前沒有房型資料。</p>';
})();
</script>
</body>
</html>
