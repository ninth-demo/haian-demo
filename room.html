<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive, noimageindex">
<meta name="author" content="Ninth 九號">
<meta name="copyright" content="© 2026 Ninth 九號. All rights reserved.">
<title>房型｜海岸小旅（網站提案示範）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chiron+Sung+HK:wght@400;700&family=Cormorant+Garamond:ital,wght@0,500;1,500&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body data-page="rooms.html">
<header id="site-head"></header>
<main>
  <div class="page-head">
    <div class="wrap">
      <p class="latin">room</p>
      <h1><span id="room-name">房型</span></h1>
      <p><span id="room-meta"></span></p>
    </div>
  </div>
  <section class="sec">
    <div class="wrap detail" id="detail"></div>
  </section>
</main>
<footer id="site-foot"></footer>
<script src="assets/data.js"></script>
<script src="assets/site.js"></script>
<script src="assets/guard.js"></script>
<script>
(function () {
  var data = HA.Store.load();
  var id = new URLSearchParams(location.search).get("id");
  var r = data.rooms.filter(function (x) { return x.id === id; })[0];
  var el = document.getElementById("detail");
  if (!r) {
    document.getElementById("room-name").textContent = "找不到這個房型";
    el.innerHTML = '<p class="muted">這個房型可能已經調整。<a href="rooms.html">回到房型列表</a>看看其他房間。</p>';
    return;
  }
  document.title = r.name + "｜海岸小旅（網站提案示範）";
  document.getElementById("room-name").textContent = r.name;
  document.getElementById("room-meta").textContent = r.guests + " 人入住，" + r.bed + "。";
  el.innerHTML = '<div class="photo">' + roomPhoto(r) + '</div>' +
    '<div><p style="font-size:18px">' + HA.esc(r.desc) + '</p>' +
    '<dl class="spec"><div><dt>人數</dt><dd>' + r.guests + ' 人</dd></div><div><dt>床型</dt><dd>' + HA.esc(r.bed) + '</dd></div>' +
    (r.size ? '<div><dt>坪數</dt><dd>' + HA.esc(r.size) + '</dd></div>' : '') +
    '<div><dt>房內設備</dt><dd><div class="chips">' + r.amenities.map(function (a) { return '<span>' + HA.esc(a) + '</span>'; }).join("") + '</div></dd></div>' +
    '<div><dt>入住退房</dt><dd>' + HA.esc(data.info.checkin) + ' 入住，' + HA.esc(data.info.checkout) + ' 退房</dd></div></dl>' +
    '<div class="price-box"><div class="row"><span>平日（週日到週四晚上）</span><b>' + HA.money(r.weekday) + '</b></div>' +
    '<div class="row"><span>假日（週五、週六晚上）</span><b>' + HA.money(r.weekend) + '</b></div>' +
    '<p class="hint">一晚一間的價格。連續假日與特殊節日可能另有房價，以訂房確認為準。</p>' +
    '<p style="margin-top:18px;display:flex;flex-wrap:wrap;gap:10px"><a class="btn btn-sea" href="booking.html?room=' + encodeURIComponent(r.id) + '">查這間的空房</a><a class="btn btn-ghost" href="policy.html">訂房須知</a></p></div></div>';
})();
</script>
</body>
</html>
