<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive, noimageindex">

<title>最新消息｜海岸小旅（網站提案示範）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chiron+Sung+HK:wght@400;700&family=Cormorant+Garamond:ital,wght@0,500;1,500&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body data-page="news.html">
<header id="site-head"></header>
<main>
  <div class="page-head">
    <div class="wrap">
      <p class="latin">news</p>
      <h1>最新消息</h1>
      <p>房價調整、連假訂房、民宿的小事，都會先公告在這裡。</p>
    </div>
  </div>
  <section class="sec" style="padding-top:64px">
    <div class="wrap"><ul class="news-list" id="news" style="margin-top:0"></ul></div>
  </section>
</main>
<footer id="site-foot"></footer>
<script src="assets/data.js"></script>
<script src="assets/site.js"></script>
<script src="assets/guard.js"></script>
<script>
(function () {
  document.getElementById("news").innerHTML = HA.sortedNews(HA.Store.load()).map(function (n) {
    return '<li><a href="news-post.html?id=' + encodeURIComponent(n.id) + '"><time datetime="' + n.date + '">' + n.date.replace(/-/g, ".") + '</time><span class="t">' + HA.esc(n.title) + '</span><span class="arrow">閱讀</span></a></li>';
  }).join("") || '<li class="muted" style="padding:22px 0">目前沒有新消息。</li>';
})();
</script>
</body>
</html>
